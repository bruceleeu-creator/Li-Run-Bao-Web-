# 域名期启用：443 反代 127.0.0.1:8080 并终结 TLS（证书路径按腾讯云 TrustAsia DV 下发位置调整）
# IP 直连过渡期不启用本配置；启用后控制台放行 80/443、收回 8080。
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/board.pem;
    ssl_certificate_key /etc/nginx/certs/board.key;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
